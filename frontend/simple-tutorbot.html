<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorBot - AI Tutor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .bot-message {
            justify-content: flex-start;
        }
        
        .user-message {
            justify-content: flex-end;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }
        
        .bot-avatar {
            background: #667eea;
        }
        
        .user-avatar {
            background: #764ba2;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }
        
        .bot-message .message-content {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .user-message .message-content {
            background: #667eea;
            color: white;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }
        
        .quick-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            background: #f0f2f5;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .text-input {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        
        .text-input:focus {
            border-color: #667eea;
        }
        
        .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-btn {
            background: #ff6b6b;
            color: white;
        }
        
        .voice-btn:hover, .voice-btn.recording {
            background: #ff5252;
            transform: scale(1.1);
        }
        
        .send-btn {
            background: #667eea;
            color: white;
        }
        
        .send-btn:hover {
            background: #5a67d8;
            transform: scale(1.1);
        }
        
        .typing {
            font-style: italic;
            color: #666;
            padding: 10px 0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #4caf50;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .notification.error {
            background: #f44336;
        }
        
        .notification.info {
            background: #2196f3;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .quick-buttons {
                flex-direction: column;
            }
            
            .quick-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 TutorBot</h1>
            <p>Your Personal AI Tutor - Ask anything!</p>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                <div class="avatar bot-avatar">🤖</div>
                <div class="message-content">
                    Hello! I'm your personal AI tutor. I'm here to help you learn and answer any questions you have. You can type your questions or use voice input. What would you like to learn today?
                </div>
            </div>
        </div>
        
        <div class="typing" id="typing" style="display: none;">
            TutorBot is typing...
        </div>
        
        <div class="input-area">
            <div class="quick-buttons">
                <button class="quick-btn" onclick="askQuestion('Explain photosynthesis')">🌱 Photosynthesis</button>
                <button class="quick-btn" onclick="askQuestion('Help with algebra')">🧮 Algebra</button>
                <button class="quick-btn" onclick="askQuestion('Grammar rules')">📚 Grammar</button>
                <button class="quick-btn" onclick="askQuestion('History facts')">🏛️ History</button>
            </div>
            
            <div class="input-container">
                <textarea 
                    class="text-input" 
                    id="messageInput" 
                    placeholder="Type your question here..."
                    rows="1"
                    onkeypress="handleKeyPress(event)"
                ></textarea>
                <button class="btn voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Input">🎤</button>
                <button class="btn send-btn" onclick="sendMessage()" title="Send Message">📤</button>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;
        
        // Initialize speech recognition
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                
                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('voiceBtn').classList.add('recording');
                    showNotification('🎤 Listening... Speak now!', 'info');
                };
                
                recognition.onend = function() {
                    isRecording = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                };
                
                recognition.onresult = function(event) {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    if (finalTranscript) {
                        document.getElementById('messageInput').value = finalTranscript;
                        sendMessage();
                    }
                };
                
                recognition.onerror = function(event) {
                    showNotification('❌ Speech recognition error', 'error');
                };
            } else {
                document.getElementById('voiceBtn').style.display = 'none';
                showNotification('⚠️ Voice input not supported in this browser', 'error');
            }
        }
        
        // Initialize text-to-speech
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }
        
        // Toggle voice recording
        function toggleVoice() {
            if (!recognition) {
                showNotification('❌ Voice recognition not available', 'error');
                return;
            }
            
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
        
        // Handle Enter key press
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // Ask predefined question
        function askQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }
        
        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTyping();
            
            // Generate AI response after delay
            setTimeout(() => {
                hideTyping();
                const response = generateResponse(message);
                addMessage(response, 'bot');
                speakText(response);
            }, 1000 + Math.random() * 2000);
        }
        
        // Add message to chat
        function addMessage(message, sender) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}-avatar`;
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = message;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatArea.appendChild(messageDiv);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Generate AI response
        function generateResponse(userMessage) {
            const responses = {
                'photosynthesis': 'Photosynthesis is the process by which plants convert light energy into chemical energy. It occurs in chloroplasts and involves the light-dependent reactions and the Calvin cycle. Plants absorb CO2 and water, using sunlight to produce glucose and oxygen.',
                'algebra': 'Algebra uses symbols and letters to represent numbers in formulas and equations. Key concepts include variables (like x, y), coefficients, expressions, and equations. Would you like help with a specific algebra problem?',
                'grammar': 'Grammar is the set of rules governing language structure. It includes parts of speech (nouns, verbs, adjectives), sentence structure, punctuation, and syntax. What specific grammar topic would you like to explore?',
                'history': 'History is the study of past events and human affairs. It helps us understand how societies and civilizations developed over time. What specific historical period or event interests you?'
            };
            
            const lowerMessage = userMessage.toLowerCase();
            
            // Check for specific topics
            for (const [key, response] of Object.entries(responses)) {
                if (lowerMessage.includes(key)) {
                    return response;
                }
            }
            
            // Default responses
            const defaultResponses = [
                "That's an interesting question! I'd be happy to help you understand this concept better. Could you provide more specific details?",
                "Great question! Let me break this down for you step by step. What specific aspect would you like to focus on?",
                "I can definitely help with that topic. Would you like me to explain the basics first, or do you have a specific problem to solve?",
                "Excellent! This is an important concept to understand. What would you like to know specifically about this topic?",
                "I love discussing this subject! Can you tell me more about what you're trying to learn or understand?"
            ];
            
            return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
        }
        
        // Show typing indicator
        function showTyping() {
            document.getElementById('typing').style.display = 'block';
        }
        
        // Hide typing indicator
        function hideTyping() {
            document.getElementById('typing').style.display = 'none';
        }
        
        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 3000);
        }
        
        // Initialize when page loads
        window.addEventListener('load', function() {
            initSpeechRecognition();
            showNotification('🎓 TutorBot is ready! Try asking a question or use voice input.', 'info');
        });
    </script>
</body>
</html>
